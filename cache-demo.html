<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CPUキャッシュと配列アクセス順序</title>
<style>html,body{margin:0;padding:0;background:#0f1117;}</style>
<!-- React / ReactDOM (UMD) -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<!-- Babel：ブラウザ内で JSX をコンパイル -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useRef, useCallback, useEffect } = React;

const GRID = 12;
const CACHE_LINE = 4; // 4 elements per "cache line" for visualization
const CACHE_CAPACITY = 8; // キャッシュが保持できるライン数。これを超えると最も古いラインから LRU で追い出す
                          // （列優先の再利用距離 12 ラインより小さいので、列優先は再利用前に追い出されミスが頻発する）

// アニメーション速度プリセット（1ステップあたりの待ち時間 ms）
const SPEEDS = [
  { label: "ゆっくり", ms: 260 },
  { label: "ふつう", ms: 110 },
  { label: "速い", ms: 25 },
];

const palette = {
  bg: "#0f1117",
  surface: "#1a1d27",
  surfaceAlt: "#232736",
  border: "#2e3348",
  text: "#e2e4ed",
  textDim: "#8b8fa7",
  hit: "#22c55e",
  hitBg: "rgba(34,197,94,0.12)",
  miss: "#ef4444",
  missBg: "rgba(239,68,68,0.12)",
  accent: "#6366f1",
  accentBg: "rgba(99,102,241,0.1)",
  current: "#facc15",
};

function buildAccessOrder(mode) {
  const order = [];
  if (mode === "row") {
    for (let r = 0; r < GRID; r++)
      for (let c = 0; c < GRID; c++)
        order.push({ r, c, idx: r * GRID + c });
  } else {
    for (let c = 0; c < GRID; c++)
      for (let r = 0; r < GRID; r++)
        order.push({ r, c, idx: r * GRID + c });
  }
  return order;
}

function getCacheLineStart(flatIdx) {
  return Math.floor(flatIdx / CACHE_LINE) * CACHE_LINE;
}

// 容量つき LRU キャッシュ。access(line) はヒットなら true、ミスなら false を返す。
// 容量を超えたら最も長く使われていないライン（Map の先頭）を追い出す。
function makeLruCache(capacity) {
  const map = new Map(); // key=ライン先頭アドレス, 挿入/更新順が LRU 順を表す
  return {
    access(line) {
      if (map.has(line)) {        // ヒット：最近使ったので末尾へ移動
        map.delete(line);
        map.set(line, 1);
        return true;
      }
      map.set(line, 1);           // ミス：読み込む
      if (map.size > capacity) {  // あふれたら最古を追い出す
        map.delete(map.keys().next().value);
      }
      return false;
    },
  };
}

function Cell({ state, isCurrent, lineEnd }) {
  const bg =
    isCurrent ? palette.current :
    state === "hit" ? palette.hit :
    state === "miss" ? palette.miss :
    "transparent";
  const opacity = isCurrent ? 1 : state ? 0.7 : 0.15;
  return (
    <div style={{
      width: 28, height: 28, borderRadius: 4,
      border: `1px solid ${state ? bg : palette.border}`,
      background: state ? bg : "transparent",
      opacity,
      transition: "all 0.08s ease",
      fontSize: 9,
      display: "flex", alignItems: "center", justifyContent: "center",
      color: isCurrent ? "#000" : state ? "#fff" : palette.textDim,
      fontWeight: isCurrent ? 700 : 400,
      fontFamily: "monospace",
      // 4要素ごと（=1キャッシュライン）の右端に区切り線を引く（隙間を埋めるだけでレイアウトは不変）
      boxShadow: lineEnd ? `2px 0 0 0 ${palette.accent}` : "none",
    }} />
  );
}

function GridViz({ cellStates, currentIdx, label, stats }) {
  return (
    <div style={{ flex: 1, minWidth: 260 }}>
      <div style={{
        fontSize: 14, fontWeight: 600, color: palette.text,
        marginBottom: 8, display: "flex", alignItems: "center", gap: 8
      }}>
        {label}
        {stats && (
          <span style={{ fontSize: 12, fontWeight: 400, color: palette.textDim }}>
            Hit: <span style={{ color: palette.hit }}>{stats.hits}</span>{" / "}
            Miss: <span style={{ color: palette.miss }}>{stats.misses}</span>
          </span>
        )}
      </div>
      <div style={{
        display: "grid",
        gridTemplateColumns: `repeat(${GRID}, 28px)`,
        gap: 2,
        padding: 12,
        background: palette.surface,
        borderRadius: 8,
        border: `1px solid ${palette.border}`,
        width: "fit-content",
      }}>
        {Array.from({ length: GRID * GRID }, (_, i) => {
          const col = i % GRID;
          const lineEnd = col % CACHE_LINE === CACHE_LINE - 1 && col !== GRID - 1;
          return <Cell key={i} state={cellStates[i]} isCurrent={i === currentIdx} lineEnd={lineEnd} />;
        })}
      </div>
      <div style={{
        marginTop: 6, fontSize: 11, color: palette.textDim, fontFamily: "monospace",
        display: "flex", gap: 4, alignItems: "center",
      }}>
        <span>1マス=1要素。左→右→次の行 の順にメモリ連続
          <span style={{ color: palette.accent }}>│</span> 縦線＝キャッシュライン境界（連続{CACHE_LINE}要素）</span>
      </div>
    </div>
  );
}

function runBenchmark(size) {
  const arr = new Float32Array(size * size);
  for (let i = 0; i < arr.length; i++) arr[i] = Math.random();

  // Row-major
  const t0 = performance.now();
  let sumR = 0;
  for (let rep = 0; rep < 3; rep++)
    for (let r = 0; r < size; r++)
      for (let c = 0; c < size; c++)
        sumR += arr[r * size + c];
  const rowTime = (performance.now() - t0) / 3;

  // Column-major
  const t1 = performance.now();
  let sumC = 0;
  for (let rep = 0; rep < 3; rep++)
    for (let c = 0; c < size; c++)
      for (let r = 0; r < size; r++)
        sumC += arr[r * size + c];
  const colTime = (performance.now() - t1) / 3;

  return { rowTime, colTime, size, sumR, sumC };
}

function Bar({ value, max, color, label, time }) {
  const pct = max > 0 ? (value / max) * 100 : 0;
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 12, height: 40 }}>
      <div style={{
        width: 90, fontSize: 13, color: palette.text, fontWeight: 500, textAlign: "right"
      }}>{label}</div>
      <div style={{
        flex: 1, height: 28, background: palette.surfaceAlt,
        borderRadius: 6, overflow: "hidden", position: "relative",
      }}>
        <div style={{
          width: `${pct}%`, height: "100%", background: color,
          borderRadius: 6, transition: "width 0.6s cubic-bezier(.4,0,.2,1)",
          minWidth: pct > 0 ? 40 : 0,
          display: "flex", alignItems: "center", justifyContent: "flex-end",
          paddingRight: 10,
        }}>
          <span style={{
            fontSize: 12, fontWeight: 700, color: "#fff",
            textShadow: "0 1px 3px rgba(0,0,0,0.5)",
          }}>{time}</span>
        </div>
      </div>
    </div>
  );
}

// アニメーションと同期して、いま実行中のループ・変数・キャッシュ判定を表示する
function LiveCode({ phase, r, c, idx, state }) {
  const idle = phase == null;
  const isRow = phase === "row";
  const tone = idle ? palette.textDim : isRow ? palette.hit : palette.miss;
  const title = idle ? "待機中" : isRow ? "✅ 行優先を実行中" : "❌ 列優先を実行中";
  const num = (v) => <b style={{ color: tone }}>{v}</b>;

  return (
    <div style={{
      background: palette.surfaceAlt,
      border: `1px solid ${idle ? palette.border : tone}`,
      borderRadius: 8, padding: 14, marginBottom: 20,
      fontFamily: "monospace", fontSize: 12.5, lineHeight: 1.8,
      minHeight: 96,
    }}>
      <div style={{
        color: tone, fontWeight: 700, marginBottom: 8,
        fontFamily: "'Inter', -apple-system, sans-serif", fontSize: 12,
      }}>
        {title}
      </div>

      {idle ? (
        <div style={{ color: palette.textDim, fontFamily: "'Inter', -apple-system, sans-serif" }}>
          「▶ アニメーション開始」を押すと、ループ変数 r・c の動きと、各アクセスの
          キャッシュ判定（ヒット / ミス）を 1 ステップずつ表示します。
        </div>
      ) : (
        <div style={{ color: palette.text }}>
          <div style={{ color: palette.textDim }}>
            {isRow ? "for (r = 0; r < 12; r++)" : "for (c = 0; c < 12; c++)"}
            {"  "}<span style={{ color: tone }}>// r = {num(r)}</span>
          </div>
          <div style={{ paddingLeft: 18, color: palette.textDim }}>
            {isRow ? "for (c = 0; c < 12; c++)" : "for (r = 0; r < 12; r++)"}
            {"  "}<span style={{ color: palette.current }}>
              // {isRow ? "c" : "r"} = {num(isRow ? c : r)} ← {isRow ? "連続変化＝メモリも連続" : "+12 ずつ飛ぶ＝毎回別ライン"}
            </span>
          </div>
          <div style={{ paddingLeft: 36 }}>
            sum += arr[{num(r)}*12 + {num(c)}]
            {"  →  "}arr[{num(idx)}]
            {state && (
              <span style={{
                marginLeft: 10, fontWeight: 700,
                color: state === "hit" ? palette.hit : palette.miss,
              }}>
                {state === "hit" ? "ヒット ✓" : "ミス ✗"}
              </span>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

function CacheDemo() {
  const [rowStates, setRowStates] = useState({});
  const [colStates, setColStates] = useState({});
  const [rowCurrent, setRowCurrent] = useState(-1);
  const [colCurrent, setColCurrent] = useState(-1);
  const [rowStats, setRowStats] = useState(null);
  const [colStats, setColStats] = useState(null);
  const [animating, setAnimating] = useState(false);
  const [benchResult, setBenchResult] = useState(null);
  const [benchRunning, setBenchRunning] = useState(false);
  const [benchSize, setBenchSize] = useState(2048);
  const cancelRef = useRef(false);
  const [speed, setSpeed] = useState(SPEEDS[0].ms); // 既定はゆっくり（コードを読めるように）
  const speedRef = useRef(SPEEDS[0].ms);            // 実行中でも即反映するため ref で保持
  const setSpeedBoth = (ms) => { setSpeed(ms); speedRef.current = ms; };

  const resetAnim = () => {
    setRowStates({});
    setColStates({});
    setRowCurrent(-1);
    setColCurrent(-1);
    setRowStats(null);
    setColStats(null);
  };

  const startAnimation = useCallback(async () => {
    if (animating) { cancelRef.current = true; return; }
    resetAnim();
    setAnimating(true);
    cancelRef.current = false;

    const rowOrder = buildAccessOrder("row");
    const colOrder = buildAccessOrder("col");

    const rStates = {};
    const cStates = {};
    let rHits = 0, rMisses = 0, cHits = 0, cMisses = 0;

    const delay = (ms) => new Promise(res => setTimeout(res, ms));

    // Row-major animation
    const rowCache = makeLruCache(CACHE_CAPACITY);
    for (let i = 0; i < rowOrder.length; i++) {
      if (cancelRef.current) break;
      const { idx } = rowOrder[i];
      const lineStart = getCacheLineStart(idx);
      if (rowCache.access(lineStart)) {
        rStates[idx] = "hit";
        rHits++;
      } else {
        rStates[idx] = "miss";
        rMisses++;
      }
      setRowStates({ ...rStates });
      setRowCurrent(idx);
      setRowStats({ hits: rHits, misses: rMisses });
      await delay(speedRef.current);
    }
    setRowCurrent(-1);

    await delay(300);

    // Column-major animation
    const colCache = makeLruCache(CACHE_CAPACITY);
    for (let i = 0; i < colOrder.length; i++) {
      if (cancelRef.current) break;
      const { idx } = colOrder[i];
      const lineStart = getCacheLineStart(idx);
      if (colCache.access(lineStart)) {
        cStates[idx] = "hit";
        cHits++;
      } else {
        cStates[idx] = "miss";
        cMisses++;
      }
      setColStates({ ...cStates });
      setColCurrent(idx);
      setColStats({ hits: cHits, misses: cMisses });
      await delay(speedRef.current);
    }
    setColCurrent(-1);
    setAnimating(false);
  }, [animating]);

  const runBench = useCallback(() => {
    setBenchRunning(true);
    setBenchResult(null);
    setTimeout(() => {
      const result = runBenchmark(benchSize);
      setBenchResult(result);
      setBenchRunning(false);
    }, 50);
  }, [benchSize]);

  // 同期コード表示用：今アクティブなフェーズと現在の r, c, idx, 判定を求める
  const liveIdx = rowCurrent >= 0 ? rowCurrent : colCurrent;
  const livePhase = rowCurrent >= 0 ? "row" : colCurrent >= 0 ? "col" : null;
  const liveR = liveIdx >= 0 ? Math.floor(liveIdx / GRID) : 0;
  const liveC = liveIdx >= 0 ? liveIdx % GRID : 0;
  const liveState = livePhase === "row" ? rowStates[liveIdx]
    : livePhase === "col" ? colStates[liveIdx] : null;

  return (
    <div style={{
      fontFamily: "'Inter', -apple-system, sans-serif",
      background: palette.bg, color: palette.text,
      minHeight: "100vh", padding: "24px 20px",
    }}>
      {/* Header */}
      <div style={{ maxWidth: 760, margin: "0 auto" }}>
        <h1 style={{
          fontSize: 22, fontWeight: 700, margin: 0,
          letterSpacing: "-0.02em",
        }}>
          CPUキャッシュと配列アクセス順序
        </h1>
        <p style={{ color: palette.textDim, fontSize: 14, margin: "6px 0 0", lineHeight: 1.5 }}>
          同じデータ・同じ計算でも、アクセス順序だけで速度が大きく変わる
        </p>

        {/* Legend */}
        <div style={{
          display: "flex", gap: 16, margin: "16px 0",
          fontSize: 12, color: palette.textDim,
        }}>
          <span style={{ display: "flex", alignItems: "center", gap: 4 }}>
            <span style={{ width: 10, height: 10, borderRadius: 2, background: palette.hit, display: "inline-block" }} />
            キャッシュヒット
          </span>
          <span style={{ display: "flex", alignItems: "center", gap: 4 }}>
            <span style={{ width: 10, height: 10, borderRadius: 2, background: palette.miss, display: "inline-block" }} />
            キャッシュミス
          </span>
          <span style={{ display: "flex", alignItems: "center", gap: 4 }}>
            <span style={{ width: 10, height: 10, borderRadius: 2, background: palette.current, display: "inline-block" }} />
            現在のアクセス
          </span>
        </div>

        {/* Animation button + speed control */}
        <div style={{
          display: "flex", alignItems: "center", gap: 10,
          flexWrap: "wrap", marginBottom: 16,
        }}>
          <button onClick={startAnimation} style={{
            padding: "8px 20px", fontSize: 13, fontWeight: 600,
            background: animating ? palette.miss : palette.accent,
            color: "#fff", border: "none", borderRadius: 6, cursor: "pointer",
          }}>
            {animating ? "■ 停止" : "▶ アニメーション開始"}
          </button>
          <span style={{ fontSize: 12, color: palette.textDim, marginLeft: 4 }}>速度:</span>
          {SPEEDS.map(s => (
            <button key={s.label} onClick={() => setSpeedBoth(s.ms)} style={{
              padding: "5px 12px", fontSize: 12, fontWeight: 500,
              background: speed === s.ms ? palette.accent : palette.surfaceAlt,
              color: speed === s.ms ? "#fff" : palette.textDim,
              border: `1px solid ${speed === s.ms ? palette.accent : palette.border}`,
              borderRadius: 4, cursor: "pointer",
            }}>
              {s.label}
            </button>
          ))}
        </div>

        {/* Live synced code */}
        <LiveCode phase={livePhase} r={liveR} c={liveC} idx={liveIdx} state={liveState} />

        {/* Grids */}
        <div style={{
          display: "flex", gap: 24, flexWrap: "wrap", marginBottom: 32,
        }}>
          <GridViz
            cellStates={rowStates} currentIdx={rowCurrent}
            label="✅ 行優先（キャッシュフレンドリー）"
            stats={rowStats}
          />
          <GridViz
            cellStates={colStates} currentIdx={colCurrent}
            label="❌ 列優先（キャッシュミス多発）"
            stats={colStats}
          />
        </div>

        {/* Explanation */}
        <div style={{
          background: palette.surface, borderRadius: 8,
          border: `1px solid ${palette.border}`,
          padding: 16, marginBottom: 32, fontSize: 13,
          lineHeight: 1.7, color: palette.textDim,
        }}>
          <strong style={{ color: palette.text }}>なぜ差が出る？</strong><br />
          C/C++ の2次元配列はメモリ上で<strong style={{ color: palette.text }}>行優先（Row-major）</strong>に並んでいる。
          CPUがメモリを読む時、1要素だけでなく <strong style={{ color: palette.text }}>キャッシュライン（64バイト = 連続16個のfloat）</strong>単位でまとめて読み込む。
          行優先でアクセスすると次の要素は<strong style={{ color: palette.text }}>同じキャッシュラインの中</strong>にあるためヒットする（空間的局所性）。
          一方、列優先だと毎回別のラインに飛ぶ。さらにキャッシュ<strong style={{ color: palette.text }}>容量は有限</strong>（このデモでは {CACHE_CAPACITY} ライン分）なので、
          一度読んだラインが<strong style={{ color: palette.text }}>再び使われる前に追い出されて</strong>しまい、ほぼ毎回ミスになる。
          <div style={{
            marginTop: 12, padding: "10px 12px", background: palette.surfaceAlt,
            borderRadius: 6, fontFamily: "monospace", fontSize: 12, color: palette.text,
            lineHeight: 1.7,
          }}>
            例：<b style={{ color: palette.current }}>arr[2][5]</b> は1次元メモリでは{" "}
            <b style={{ color: palette.current }}>2*12 + 5 = 29</b> 番地。<br />
            連続する <b style={{ color: palette.accent }}>28, 29, 30, 31</b> 番地が1キャッシュライン（連続{CACHE_LINE}要素）。<br />
            <span style={{ color: palette.hit }}>行優先</span>：c を +1 → 30, 31 番地と<b>同じライン内</b>を読む（ヒット）。{" "}
            <span style={{ color: palette.miss }}>列優先</span>：r を +1 → 29→41番地と<b>12個飛ぶ</b>（別ライン＝ミス）。
          </div>
        </div>

        {/* Benchmark section */}
        <div style={{
          background: palette.surface, borderRadius: 8,
          border: `1px solid ${palette.border}`, padding: 20,
        }}>
          <h2 style={{ fontSize: 16, fontWeight: 600, margin: "0 0 4px" }}>
            実測ベンチマーク
          </h2>
          <p style={{ fontSize: 12, color: palette.textDim, margin: "0 0 16px" }}>
            このブラウザ上でFloat32Array ({benchSize}×{benchSize}) を実際に走らせて計測
          </p>

          <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 16, flexWrap: "wrap" }}>
            <label style={{ fontSize: 12, color: palette.textDim }}>配列サイズ:</label>
            {[1024, 2048, 4096].map(s => (
              <button key={s} onClick={() => setBenchSize(s)} style={{
                padding: "4px 12px", fontSize: 12, fontWeight: 500,
                background: benchSize === s ? palette.accent : palette.surfaceAlt,
                color: benchSize === s ? "#fff" : palette.textDim,
                border: `1px solid ${benchSize === s ? palette.accent : palette.border}`,
                borderRadius: 4, cursor: "pointer",
              }}>
                {s}×{s}
              </button>
            ))}
            <button onClick={runBench} disabled={benchRunning} style={{
              padding: "6px 20px", fontSize: 13, fontWeight: 600,
              background: benchRunning ? palette.surfaceAlt : palette.accent,
              color: "#fff", border: "none", borderRadius: 6, cursor: benchRunning ? "wait" : "pointer",
              marginLeft: 8,
            }}>
              {benchRunning ? "計測中..." : "▶ 計測する"}
            </button>
          </div>

          {benchResult && (
            <div>
              <Bar
                value={benchResult.rowTime}
                max={Math.max(benchResult.rowTime, benchResult.colTime)}
                color={palette.hit}
                label="行優先"
                time={`${benchResult.rowTime.toFixed(1)} ms`}
              />
              <div style={{ height: 6 }} />
              <Bar
                value={benchResult.colTime}
                max={Math.max(benchResult.rowTime, benchResult.colTime)}
                color={palette.miss}
                label="列優先"
                time={`${benchResult.colTime.toFixed(1)} ms`}
              />
              <div style={{
                marginTop: 12, padding: "8px 12px",
                background: palette.accentBg, borderRadius: 6,
                fontSize: 14, fontWeight: 600, color: palette.accent,
                textAlign: "center",
              }}>
                列優先は行優先より {(benchResult.colTime / benchResult.rowTime).toFixed(1)}倍 遅い
              </div>
            </div>
          )}
        </div>

        {/* Code comparison */}
        <div style={{
          marginTop: 24, background: palette.surface, borderRadius: 8,
          border: `1px solid ${palette.border}`, padding: 20,
        }}>
          <h2 style={{ fontSize: 16, fontWeight: 600, margin: "0 0 12px" }}>
            コード比較
          </h2>
          <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
            <pre style={{
              flex: 1, minWidth: 240, margin: 0, padding: 12,
              background: palette.surfaceAlt, borderRadius: 6,
              fontSize: 11, lineHeight: 1.6, color: palette.hit,
              overflow: "auto", border: `1px solid ${palette.border}`,
            }}>{`// ✅ 行優先（高速）
for (r = 0; r < N; r++)
  for (c = 0; c < N; c++)
    sum += arr[r * N + c];`}</pre>
            <pre style={{
              flex: 1, minWidth: 240, margin: 0, padding: 12,
              background: palette.surfaceAlt, borderRadius: 6,
              fontSize: 11, lineHeight: 1.6, color: palette.miss,
              overflow: "auto", border: `1px solid ${palette.border}`,
            }}>{`// ❌ 列優先（低速）
for (c = 0; c < N; c++)
  for (r = 0; r < N; r++)
    sum += arr[r * N + c];`}</pre>
          </div>
        </div>

        <p style={{
          marginTop: 20, fontSize: 11, color: palette.textDim,
          textAlign: "center",
        }}>
          ※ 実測値はブラウザ・OS・ハードウェアにより異なります。Cのネイティブ実行ではさらに大きな差が出ます。
        </p>
      </div>
