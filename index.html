<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>メモリ階層 — インタラクティブ解説</title>
<style>
  /* ===== テーマ変数（ダークモード対応） ===== */
  :root, .dark {
    --bg:#0b0f17; --fg:#e6edf6; --muted:#0f1521;
    --card:#121a27; --border:#22304a; --grid:#1b2435;
  }
  .light {
    --bg:#f6f8fc; --fg:#0d1320; --muted:#eef2f9;
    --card:#ffffff; --border:#dde5f1; --grid:#e6ecf6;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; }
  body {
    background:var(--bg); color:var(--fg);
    font-family:-apple-system,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif;
    transition:background .3s,color .3s; line-height:1.6;
  }
  .wrap { max-width:960px; margin:0 auto; padding:40px 20px 64px; }

  /* ヘッダー */
  .hero {
    border-radius:24px; padding:40px 32px; margin-bottom:40px;
    background:
      radial-gradient(70% 120% at 15% 0%, rgba(249,115,22,.18), transparent 60%),
      radial-gradient(70% 120% at 50% 0%, rgba(168,85,247,.18), transparent 60%),
      radial-gradient(70% 120% at 85% 0%, rgba(6,182,212,.20), transparent 60%);
    display:flex; justify-content:space-between; align-items:flex-start; gap:16px;
  }
  .hero .kicker { font-size:13px; letter-spacing:.2em; opacity:.7; margin:0 0 8px; }
  .hero h1 { font-size:clamp(26px,5vw,38px); font-weight:900; margin:0; line-height:1.2; }
  .hero p { font-size:14px; opacity:.85; max-width:560px; margin:12px 0 0; }
  .toggle {
    flex-shrink:0; border:1px solid var(--border); background:var(--card); color:var(--fg);
    border-radius:999px; padding:8px 14px; font-size:14px; cursor:pointer; transition:.2s;
  }
  .toggle:hover { transform:translateY(-1px); }

  /* セクション見出し */
  .sec { margin-bottom:56px; }
  .sec-title { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .sec-num {
    border-radius:8px; padding:4px 9px; font-size:13px; font-weight:900;
    background:var(--muted); color:var(--fg);
  }
  .sec-num.hl { background:rgba(244,63,94,.15); color:#fb7185; }
  .sec-title h2 { font-size:clamp(20px,3vw,26px); font-weight:800; margin:0; }
  .lead { font-size:14px; opacity:.85; margin:0 0 20px; }
  .note { font-size:12px; opacity:.6; margin-top:14px; }
  .red { color:#fb7185; }

  /* 比喩カード */
  .analogy-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .ac {
    position:relative; border:1px solid var(--border); background:var(--card);
    border-radius:16px; padding:20px; text-align:center; transition:transform .2s;
    display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .ac:hover { transform:translateY(-4px); }
  .ac .emoji { font-size:40px; }
  .ac .role { font-size:12px; font-weight:800; }
  .ac .ttl { font-size:14px; font-weight:700; }
  .ac .desc { font-size:12px; opacity:.7; }
  .ac .arrow { position:absolute; right:-10px; top:50%; transform:translateY(-50%); font-size:18px; opacity:.4; }

  /* 階層カード */
  .tiers { display:flex; gap:16px; }
  .spine-col { display:flex; flex-direction:column; align-items:center; padding-top:4px; }
  .spine-col span { font-size:10px; font-weight:800; opacity:.7; }
  .spine { width:4px; flex:1; border-radius:999px; margin:8px 0;
    background:linear-gradient(180deg,#f97316,#a855f7,#06b6d4); }
  .tier-list { flex:1; }
  .gap-badge { display:flex; justify-content:center; padding:4px 0; }
  .gap-badge span {
    border:1px solid var(--border); background:var(--card); border-radius:999px;
    padding:2px 12px; font-size:11px; opacity:.85;
  }
  .card {
    width:100%; text-align:left; border:1px solid var(--border); background:var(--card);
    border-radius:16px; padding:16px; cursor:pointer; transition:.3s; margin-bottom:6px;
    color:var(--fg); display:block;
  }
  .card:hover { transform:translateY(-2px); }
  .card-head { display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .card-head-left { display:flex; align-items:center; gap:12px; min-width:0; }
  .badge {
    width:36px; height:36px; flex-shrink:0; border-radius:12px; color:#0b0f17;
    font-size:13px; font-weight:800; display:flex; align-items:center; justify-content:center;
  }
  .card .name { font-weight:800; }
  .card .sub { font-size:12px; opacity:.6; }
  .card .analogy { font-size:12px; opacity:.7; display:block; }
  .chev { font-size:12px; transition:transform .3s; }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:12px; }
  .stat .lbl { font-size:11px; text-transform:uppercase; letter-spacing:.05em; opacity:.6; display:block; }
  .stat .val { font-size:14px; font-weight:700; font-variant-numeric:tabular-nums; }
  .mech {
    border-top:1px solid var(--border); margin-top:12px; padding-top:12px;
    font-size:14px; display:none;
  }
  .card.open .mech { display:block; }
  .mech b { font-weight:700; }

  /* 比較表 */
  .table-wrap { overflow-x:auto; border:1px solid var(--border); border-radius:16px; }
  table { width:100%; min-width:620px; border-collapse:collapse; font-size:14px; }
  th, td { padding:12px; text-align:left; vertical-align:top; }
  thead th { background:var(--muted); }
  thead .ct { font-weight:800; }
  thead .cs { font-size:12px; opacity:.6; }
  tbody tr:nth-child(even) { background:var(--muted); }
  td.rowlbl { font-size:12px; font-weight:700; opacity:.7; white-space:nowrap; }

  /* チャート */
  .chart-box { border:1px solid var(--border); background:var(--card); border-radius:16px; padding:16px; }
  .legend { display:flex; flex-wrap:wrap; gap:16px; font-size:12px; margin-bottom:12px; align-items:center; }
  .legend span.item { display:inline-flex; align-items:center; gap:6px; }
  .dot { width:12px; height:12px; border-radius:999px; display:inline-block; }
  #chart { width:100%; height:380px; display:block; }
  .axis-caption { text-align:center; font-size:11px; opacity:.6; margin-top:4px; }
  .bubble { cursor:pointer; transition:opacity .2s; }
  .bubble:hover { opacity:1 !important; }
  .tip {
    position:fixed; pointer-events:none; z-index:50; display:none;
    border-radius:12px; padding:8px 12px; font-size:12px;
    background:var(--card); border:1px solid var(--border); box-shadow:0 8px 24px rgba(0,0,0,.3);
  }
  .tip .tn { font-weight:800; }
  .scale-row { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:16px; text-align:center; }
  .scale-cell { border:1px solid var(--border); background:var(--card); border-radius:12px; padding:12px; font-size:12px; }
  .scale-cell .k { font-size:18px; font-weight:900; font-variant-numeric:tabular-nums; }
  .scale-cell .v { opacity:.7; }

  .notes-list { margin:0; padding-left:1.2em; font-size:13px; opacity:.88; }
  .notes-list li { margin-bottom:10px; line-height:1.7; }
  .notes-list b { font-weight:700; }

  footer { margin-top:48px; border-top:1px solid var(--border); padding-top:24px; font-size:12px; opacity:.5; }

  /* レスポンシブ */
  @media (max-width:640px) {
    .analogy-grid { grid-template-columns:repeat(2,1fr); }
    .ac .arrow { display:none; }
    .spine-col { display:none; }
    .stats { grid-template-columns:repeat(2,1fr); }
    .scale-row { grid-template-columns:repeat(2,1fr); }
  }
</style>
</head>
<body class="dark">
  <div class="wrap" id="app"></div>
  <div class="tip" id="tip"></div>

<script>
// ===== データ =====
const CATEGORY = {
  storage: { label:"Storage", color:"#f97316", soft:"rgba(249,115,22,0.14)" },
  ram:     { label:"RAM",     color:"#a855f7", soft:"rgba(168,85,247,0.14)" },
  cache:   { label:"Cache",   color:"#06b6d4", soft:"rgba(6,182,247,0.14)" },
};

const TIERS = [
  { id:"hdd", cat:"storage", name:"HDD", sub:"磁気ディスク", capacity:"TB 級",
    latency:"~5–10 ms", bandwidth:"~200 MB/s", cost:"~¥3/GB",
    mechanism:"回転する磁気プラッタ＋機械式の読み書きアーム。物理的に動くため最も遅い。",
    latencyNs:7000000, capBytes:4e12, analogy:"地下倉庫 — 階段を降りて取りに行く" },
  { id:"ssd", cat:"storage", name:"SSD (NVMe)", sub:"NAND Flash", capacity:"TB 級",
    latency:"~50–100 μs", bandwidth:"~5–7 GB/s", cost:"~¥12/GB",
    mechanism:"NAND フラッシュメモリ。可動部が無く PCIe 経由で接続。HDD の約100倍高速。",
    latencyNs:75000, capBytes:2e12, analogy:"本棚 — 数歩あるけば届く" },
  { id:"ddr5", cat:"ram", name:"DDR5", sub:"デスクトップ", capacity:"数十〜数百 GB",
    latency:"~60–80 ns", bandwidth:"~90 GB/s（デュアルチャネル）", cost:"~¥600/GB",
    mechanism:"DRAM（1T1C：1トランジスタ＋1キャパシタ）。PCB 配線で CPU と接続。",
    latencyNs:70, capBytes:6.4e10, analogy:"デスク — 手を伸ばせば届く" },
  { id:"lpddr5x", cat:"ram", name:"LPDDR5X", sub:"Apple M4 Max（統合メモリ）", capacity:"~128 GB",
    latency:"~80–100 ns", bandwidth:"~546 GB/s", cost:"—（SoC 統合）",
    mechanism:"統合メモリ（CPU/GPU/NPU が共有）。LPDDR を SoC ダイの真横に並べてオンパッケージ実装（PoP 積層ではなく横並び配置）。データコピーが不要。",
    latencyNs:90, capBytes:1.28e11, analogy:"デスク（広い）— CPU/GPU が同じ机を共有" },
  { id:"hbm3", cat:"ram", name:"HBM3", sub:"NVIDIA H100", capacity:"~80 GB",
    latency:"~100 ns", bandwidth:"~3.35 TB/s", cost:"—（超高価）",
    mechanism:"DRAM 1T1C を 3D 積層＋TSV（貫通電極）でシリコンインターポーザ上に接続。広帯域。",
    latencyNs:100, capBytes:8e10, analogy:"デスク（超巨大）— 一度に大量を広げられる" },
  { id:"l3", cat:"cache", name:"L3 Cache", sub:"SRAM", capacity:"数十 MB",
    latency:"~10–20 ns", bandwidth:"~200–800 GB/s", cost:"—（ダイ面積）",
    mechanism:"SRAM（6T 構造）。複数コアで共有し、CPU と同一ダイ上に製造。",
    latencyNs:15, capBytes:6.4e7, analogy:"机の端に積んだ資料" },
  { id:"l2", cat:"cache", name:"L2 Cache", sub:"SRAM", capacity:"~512 KB–2 MB / コア",
    latency:"~3–5 ns", bandwidth:"~500 GB/s–1 TB/s / コア", cost:"—（ダイ面積）",
    mechanism:"SRAM（6T）。コアごとに専用。L1 から溢れたデータを保持。",
    latencyNs:4, capBytes:1e6, analogy:"今めくっている資料の隣のページ" },
  { id:"l1", cat:"cache", name:"L1 Cache", sub:"SRAM", capacity:"~32–64 KB / コア",
    latency:"~1 ns", bandwidth:"~1–3 TB/s / コア", cost:"—（ダイ面積）",
    mechanism:"SRAM（6T）。CPU コア直結で最速。命令用とデータ用に分離。",
    latencyNs:1, capBytes:6.4e4, analogy:"今この瞬間に見ている、開いたページそのもの" },
];

const COMPARE_COLS = [
  { key:"cpu",   title:"従来型 CPU",   sub:"Intel / AMD",  color:"#a855f7" },
  { key:"apple", title:"Apple M 系列", sub:"統合メモリ",    color:"#34d399" },
  { key:"gpu",   title:"NVIDIA GPU",   sub:"データセンター", color:"#22d3ee" },
];
const COMPARE_ROWS = [
  { label:"メモリ種類", cpu:"DDR5", apple:"LPDDR5X 統合メモリ", gpu:"HBM3" },
  { label:"帯域幅", cpu:"~90 GB/s", apple:"~546 GB/s", gpu:"~3,350 GB/s" },
  { label:"Cache 戦略", cpu:"大容量 L3（数十 MB ※）", apple:"中程度", gpu:"L2 重視（~50 MB）" },
  { label:"設計思想", cpu:"レイテンシ最小化", apple:"データコピー排除", gpu:"スループット最大化" },
  { label:"得意な処理", cpu:"逐次・分岐の多い汎用処理", apple:"混合ワークロード", gpu:"大規模並列演算" },
];

const ANALOGY = [
  { emoji:"📖", title:"開いたページ", role:"Cache", desc:"すぐ見える", color:"#06b6d4" },
  { emoji:"🗄️", title:"デスク", role:"RAM", desc:"手を伸ばせば届く", color:"#a855f7" },
  { emoji:"📚", title:"本棚", role:"SSD", desc:"数歩あるく", color:"#fb923c" },
  { emoji:"🏚️", title:"地下倉庫", role:"HDD", desc:"階段を降りる", color:"#f97316" },
];

// ===== ユーティリティ =====
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmtNs(ns){ if(ns>=1e6) return (ns/1e6)+" ms"; if(ns>=1e3) return (ns/1e3)+" μs"; return ns+" ns"; }
// 倍率を有効数字2桁ていどに丸めて表示（例: 750→"750", 93.3→"90"）
function fmtRatio(r){
  if(r>=1000) return (Math.round(r/100)*100).toLocaleString();
  if(r>=100)  return String(Math.round(r/10)*10);
  return String(Math.round(r));
}

// ===== HTML 構築 =====
function statHtml(lbl,val){ return `<div class="stat"><span class="lbl">${esc(lbl)}</span><span class="val">${esc(val)}</span></div>`; }

function cardHtml(t){
  const c = CATEGORY[t.cat];
  return `<button class="card" data-id="${t.id}" style="border-color:var(--border)">
    <div class="card-head">
      <div class="card-head-left">
        <span class="badge" style="background:${c.color}">${c.label[0]}</span>
        <div style="min-width:0">
          <div style="display:flex;align-items:baseline;gap:8px">
            <span class="name">${esc(t.name)}</span><span class="sub">${esc(t.sub)}</span>
          </div>
          <span class="analogy">${esc(t.analogy)}</span>
        </div>
      </div>
      <span class="chev" style="color:${c.color}">▼</span>
    </div>
    <div class="stats">
      ${statHtml("容量",t.capacity)}${statHtml("レイテンシ",t.latency)}
      ${statHtml("帯域幅",t.bandwidth)}${statHtml("コスト/GB",t.cost)}
    </div>
    <div class="mech"><b style="color:${c.color}">物理的な仕組み：</b>${esc(t.mechanism)}</div>
  </button>`;
}

function build(){
  // レイテンシ昇順（上＝速い／下＝遅い）で厳密に並べる
  const ordered = [...TIERS].sort((a,b)=>a.latencyNs-b.latencyNs);
  let tierHtml = "";
  ordered.forEach((t,i)=>{
    const prev = ordered[i-1];
    if(prev){
      const ratio = t.latencyNs/prev.latencyNs;
      // 階層をまたぐ大きな段差（10倍以上）に実測倍率を表示
      if(ratio>=10){
        tierHtml += `<div class="gap-badge"><span>⟱ レイテンシ <b class="red">約${fmtRatio(ratio)}倍</b></span></div>`;
      }
    }
    tierHtml += cardHtml(t);
  });

  const analogyHtml = ANALOGY.map((a,i)=>`
    <div class="ac">
      <span class="emoji">${a.emoji}</span>
      <span class="role" style="color:${a.color}">${a.role}</span>
      <span class="ttl">${esc(a.title)}</span>
      <span class="desc">${esc(a.desc)}</span>
      ${i<ANALOGY.length-1?'<span class="arrow">→</span>':''}
    </div>`).join("");

  const theadCols = COMPARE_COLS.map(c=>`<th><div class="ct" style="color:${c.color}">${esc(c.title)}</div><div class="cs">${esc(c.sub)}</div></th>`).join("");
  const tbodyRows = COMPARE_ROWS.map(r=>`<tr><td class="rowlbl">${esc(r.label)}</td>${COMPARE_COLS.map(c=>`<td>${esc(r[c.key])}</td>`).join("")}</tr>`).join("");

  const legendHtml = Object.values(CATEGORY).map(c=>`<span class="item"><span class="dot" style="background:${c.color}"></span>${c.label}</span>`).join("")
    + `<span style="opacity:.6">（バブル大 = 容量大）</span>`;

  const scaleCells = [
    {k:"1 ns", v:"L1 Cache", c:CATEGORY.cache.color},
    {k:"~100 ns", v:"RAM (DDR5/HBM)", c:CATEGORY.ram.color},
    {k:"~75 μs", v:"SSD", c:CATEGORY.storage.color},
    {k:"~7 ms", v:"HDD", c:CATEGORY.storage.color},
  ].map(s=>`<div class="scale-cell"><div class="k" style="color:${s.c}">${s.k}</div><div class="v">${s.v}</div></div>`).join("");

  document.getElementById("app").innerHTML = `
    <header class="hero">
      <div>
        <p class="kicker">MEMORY HIERARCHY</p>
        <h1>データは計算からどれくらい遠い？</h1>
        <p>Storage → RAM → Cache。CPU/GPU に近づくほど「速く・小さく・高価」に。階層をまたぐとレイテンシは <b class="red">数十〜千倍</b> のオーダーで跳ね上がります。その桁違いを体感してください。</p>
      </div>
      <button class="toggle" id="themeBtn">☀️ Light</button>
    </header>

    <section class="sec">
      <div class="sec-title"><span class="sec-num">01</span><h2>書斎で論文を書く、という比喩</h2></div>
      <p class="lead">あなたが今いるのが「計算（CPU）」。必要なデータがどこにあるかで、取りに行く手間がまるで違います。</p>
      <div class="analogy-grid">${analogyHtml}</div>
      <p class="note">※ 左ほど計算に近い（速い）。右にいくほど「歩く距離」＝レイテンシが伸びていきます。</p>
    </section>

    <section class="sec">
      <div class="sec-title"><span class="sec-num">02</span><h2>各階層の詳細（クリックで展開）</h2></div>
      <div class="tiers">
        <div class="spine-col"><span>近い</span><div class="spine"></div><span>遠い</span></div>
        <div class="tier-list">${tierHtml}</div>
      </div>
    </section>

    <section class="sec">
      <div class="sec-title"><span class="sec-num hl">03</span><h2>分岐点：RAM の先で道が分かれた</h2></div>
      <p class="lead">RAM 層から先、3 つのアーキテクチャは<b>異なる最適化</b>を選びました。「何を犠牲にして何を得たか」が設計思想に表れています。</p>
      <div class="table-wrap">
        <table>
          <thead><tr><th></th>${theadCols}</tr></thead>
          <tbody>${tbodyRows}</tbody>
        </table>
      </div>
      <p class="note">帯域幅は CPU(90) → Apple(546) → GPU(3,350) GB/s と、約 <b>37 倍</b> の開き。GPU は「遅くてもいいから一度に大量に」、CPU は「とにかく速く 1 件ずつ」を選んでいます。</p>
    </section>

    <section class="sec">
      <div class="sec-title"><span class="sec-num">04</span><h2>全体マップ：対数スケールで見る桁違い</h2></div>
      <p class="lead">横軸はレイテンシ（<b>対数</b>：1 ns → 10 ms）。バブルの大きさ＝容量、色＝種類。L1 と HDD はレイテンシで <b class="red">約 700 万倍</b> 離れています。</p>
      <div class="legend">${legendHtml}</div>
      <div class="chart-box">
        <svg id="chart" viewBox="0 0 920 380" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="axis-caption">← 計算に近い（速い）　　レイテンシ（対数）　　遠い（遅い）→</div>
      </div>
      <div class="scale-row">${scaleCells}</div>
    </section>

    <section class="sec">
      <div class="sec-title"><span class="sec-num">※</span><h2>極端な例外・補足（本文は代表値）</h2></div>
      <ul class="notes-list">
        <li><b>Apple Silicon の Cache は大きめ</b>：M シリーズの高性能コアは L1 が 128KB 超、L2 はコアクラスタで共有し 16〜32MB に達する（x86 より大容量）。本文の「~32–64KB」「~512KB–2MB」は x86 を基準にした代表値。</li>
        <li><b>サーバ CPU の L3 は桁違い</b>：比較表の「数十 MB ※」はデスクトップ向け。AMD EPYC + 3D V-Cache では L3 が数百 MB〜1GB 超（例: EPYC 9684X ≈ 1,152MB）。</li>
        <li><b>H100 は版で数値が変わる</b>：本文は SXM5 版（HBM3・80GB・3.35TB/s）。PCIe 版は HBM2e・約 2TB/s、NVL 版は 94GB。</li>
        <li><b>SSD の帯域は世代依存</b>：本文の ~5–7GB/s は PCIe 4.0。PCIe 5.0 NVMe は ~14GB/s に達する。生のデバイスレイテンシは ~20μs まで下がる場合も。</li>
        <li><b>DDR5 の帯域はクロック次第</b>：~90GB/s は DDR5-5600 デュアルチャネルの例。速度等級・チャネル数で増減する。</li>
        <li><b>L3 を「同一ダイ」と記載</b>：一般的な構成。AMD の 3D V-Cache は L3 を別ダイで積層する例外。</li>
      </ul>
    </section>

    <footer>本文の数値は代表的な目安です（製品・世代で変動）。極端な例外は上の補足を参照。Storage=暖色 / RAM=中間色 / Cache=寒色。</footer>
  `;

  drawChart();
  attachEvents();
}

// ===== SVG 対数チャート =====
function drawChart(){
  const svg = document.getElementById("chart");
  const W=920, H=380, padL=70, padR=30, padT=30, padB=46;
  const plotW = W-padL-padR, plotH = H-padT-padB;
  // X: log10(latencyNs) 0 → 7
  const xMin=0, xMax=7;
  const xPix = (ns)=> padL + (Math.log10(ns)-xMin)/(xMax-xMin)*plotW;
  // Y: 3 lanes（storage上 / ram中 / cache下）
  const lane = { storage:0, ram:1, cache:2 };
  const laneCenter = (cat)=> padT + (lane[cat]+0.5)/3*plotH;
  // バブル半径: 容量(log)を 8〜26 にマップ
  const caps = TIERS.map(t=>Math.log10(t.capBytes));
  const cMin=Math.min(...caps), cMax=Math.max(...caps);
  const rPix = (cap)=> 8 + (Math.log10(cap)-cMin)/(cMax-cMin)*18;

  // ── 衝突回避：各レーン内で x が近いバブルを上下にずらす ──
  const placed = []; // {x,y,r}
  const offsets = [0, -1, 1, -2, 2, -3, 3]; // レーン中心からの段
  const STEP = 30; // 1段あたりの縦ずらし量(px)
  const nodes = TIERS.map(t=>({ t, x:xPix(t.latencyNs), r:rPix(t.capBytes), cat:t.cat }));
  // x昇順で配置（近いもの同士の判定を安定させる）
  nodes.sort((a,b)=>a.x-b.x);
  nodes.forEach(n=>{
    const cy = laneCenter(n.cat);
    let chosen = cy;
    for(const off of offsets){
      const y = cy + off*STEP;
      // 枠内チェック
      if(y - n.r < padT+2 || y + n.r > padT+plotH-2) continue;
      // 既存バブルとの重なりチェック
      const hit = placed.some(p=>{
        const dx=p.x-n.x, dy=p.y-y;
        return Math.sqrt(dx*dx+dy*dy) < (p.r+n.r+6);
      });
      if(!hit){ chosen=y; break; }
    }
    n.y = chosen;
    placed.push({x:n.x, y:chosen, r:n.r});
  });

  let s = "";
  // グリッド縦線 + X軸ラベル（10^0 .. 10^7）
  for(let e=0; e<=7; e++){
    const x = xPix(Math.pow(10,e));
    s += `<line x1="${x}" y1="${padT}" x2="${x}" y2="${padT+plotH}" stroke="var(--grid)" stroke-dasharray="3 3"/>`;
    s += `<text x="${x}" y="${padT+plotH+20}" fill="var(--fg)" opacity="0.65" font-size="11" text-anchor="middle">${fmtNs(Math.pow(10,e))}</text>`;
  }
  // レーン区切りの薄い横線 + Y軸ラベル
  [["Storage","storage"],["RAM","ram"],["Cache","cache"]].forEach(([txt,cat])=>{
    s += `<text x="${padL-12}" y="${laneCenter(cat)+4}" fill="var(--fg)" opacity="0.65" font-size="12" text-anchor="end">${txt}</text>`;
  });
  // バブル（ラベルは円の上、ずらした位置に追従）
  nodes.forEach(n=>{
    const t=n.t, c=CATEGORY[t.cat].color;
    s += `<circle class="bubble" cx="${n.x}" cy="${n.y}" r="${n.r}" fill="${c}" fill-opacity="0.78" stroke="${c}"
      data-name="${esc(t.name)}" data-lat="${esc(t.latency)}" data-cap="${esc(t.capacity)}" data-bw="${esc(t.bandwidth)}" data-color="${c}"/>`;
    s += `<text x="${n.x}" y="${n.y - n.r - 5}" fill="var(--fg)" opacity="0.85" font-size="10" font-weight="600" text-anchor="middle">${esc(t.name)}</text>`;
  });
  svg.innerHTML = s;

  // ツールチップ
  const tip = document.getElementById("tip");
  svg.querySelectorAll(".bubble").forEach(b=>{
    b.addEventListener("mousemove",(e)=>{
      tip.style.display="block";
      tip.style.left=(e.clientX+14)+"px";
      tip.style.top=(e.clientY+14)+"px";
      tip.style.borderColor=b.dataset.color;
      tip.innerHTML=`<div class="tn" style="color:${b.dataset.color}">${b.dataset.name}</div>
        <div style="opacity:.8">レイテンシ: ${b.dataset.lat}</div>
        <div style="opacity:.8">容量: ${b.dataset.cap}</div>
        <div style="opacity:.8">帯域幅: ${b.dataset.bw}</div>`;
    });
    b.addEventListener("mouseleave",()=>{ tip.style.display="none"; });
  });
}

// ===== イベント =====
function attachEvents(){
  // カード展開
  document.querySelectorAll(".card").forEach(card=>{
    card.addEventListener("click",()=>{
      const willOpen = !card.classList.contains("open");
      document.querySelectorAll(".card").forEach(c=>{
        c.classList.remove("open");
        c.style.borderColor="var(--border)"; c.style.background="var(--card)"; c.style.boxShadow="none";
        c.querySelector(".chev").style.transform="none";
      });
      if(willOpen){
        const t = TIERS.find(x=>x.id===card.dataset.id);
        const c = CATEGORY[t.cat];
        card.classList.add("open");
        card.style.borderColor=c.color; card.style.background=c.soft;
        card.style.boxShadow=`0 8px 30px -12px ${c.color}`;
        card.querySelector(".chev").style.transform="rotate(180deg)";
      }
    });
  });
  // テーマ切替
  const btn = document.getElementById("themeBtn");
  btn.addEventListener("click",()=>{
    const dark = document.body.classList.contains("dark");
    document.body.classList.toggle("dark",!dark);
    document.body.classList.toggle("light",dark);
    btn.textContent = dark ? "🌙 Dark" : "☀️ Light";
  });
}

// 初期表示：L1 を開いておく
build();
document.querySelector('.card[data-id="l1"]').click();
</script>
